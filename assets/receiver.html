<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typepaste 接收端</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Menlo", "Consolas", monospace;
    background: #14161a; color: #e8eaed; margin: 0; padding: 24px 28px;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  #qrw {
    position: fixed; top: 16px; right: 16px;
    background: #fff; padding: 12px; border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }
  #qrcode svg, #qrcode img, #qrcode canvas, #qrcode table { display: block; }
  #pick {
    font-size: 18px; padding: 10px 22px; margin: 8px 0 18px;
    border: 0; border-radius: 8px; background: #2d7ef7; color: #fff; cursor: pointer;
  }
  #pick:hover { background: #4b91ff; }
  #status { font-size: 26px; font-weight: 700; padding: 6px 0; }
  #sub { font-size: 15px; color: #9aa0a6; padding: 4px 0; word-break: break-all; }
  #hint { font-size: 14px; color: #6b7075; margin-top: 24px; line-height: 1.7; }
  .ok { color: #5fdd7a !important; }
  .warn { color: #ffcf5c !important; }
  .err { color: #ff6b6b !important; }
  /* 实时数据面板 */
  #recvwrap { margin-top: 18px; max-width: 900px; }
  #recvprog {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 14px; color: #9aa0a6;
  }
  #recvbar {
    flex: 0 0 220px; height: 8px; background: #23272e; border-radius: 4px; overflow: hidden;
  }
  #recvbarfill { height: 100%; width: 0%; background: #2d7ef7; transition: width .2s; }
  #dataView {
    background: #0d0f12; border: 1px solid #2a2e35; border-radius: 8px;
    height: 280px; overflow-y: auto; padding: 10px 14px; margin: 0;
    font-size: 12px; line-height: 1.55; white-space: pre; font-family: "Menlo", "Consolas", monospace;
    color: #b8c0cc;
  }
  #dataView::-webkit-scrollbar { width: 10px; }
  #dataView::-webkit-scrollbar-thumb { background: #2a2e35; border-radius: 5px; }
  #dataView .evt { color: #ffcf5c; }
  #dataView .ok { color: #5fdd7a; }
  #dataView .err { color: #ff6b6b; }
  #dataView .dim { color: #5f6b7a; }
</style>
</head>
<body>
  <div id="qrw"><div id="qrcode"></div></div>
  <h1>typepaste 网页接收端</h1>
  <button id="pick">① 选择保存目录（一次性授权）</button>
  <div id="status">准备就绪，等待授权目录…</div>
  <div id="sub"></div>
  <div id="recvwrap">
    <div id="recvprog">
      <div id="recvbar"><div id="recvbarfill"></div></div>
      <span id="recvtext">等待传输…</span>
    </div>
    <pre id="dataView"></pre>
  </div>
  <div id="hint">
    操作步骤：<br>
    1. 点击上方按钮，选择文件保存目录（Chrome / Edge，需 FileSystem API 支持）<br>
    2. 保持本页面为当前活动窗口（失焦会自动暂停）<br>
    3. 在本机启动 <code>typepaste --web &lt;文件&gt;</code><br>
    二维码为本机反馈通道，请勿遮挡右上角区域。
  </div>

  for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

/* ===== 状态 ===== */
var $status = document.getElementById('status');
var $sub = document.getElementById('sub');
var dirHandle = null;
var fileName = null;     // 目标文件名（最终落盘名）
var total = 0;           // 分片总数
var rawSize = 0;         // 原始文件字节数
var zflag = 0;           // 压缩标志
var received = new Set();// 已成功落盘的 seq 集合
var frameBuf = '';
var inFrame = false;
var transferStart = 0;   // 首片落盘时间戳（ms）

function setStatus(text, cls) {
  $status.textContent = text;
  $status.className = cls || '';
}

/* ===== 实时数据面板（滚动显示） ===== */
var $dataView = document.getElementById('dataView');
var $recvbarfill = document.getElementById('recvbarfill');
var $recvtext = document.getElementById('recvtext');
var MAX_VIEW_LINES = 800;      // 面板最多保留行数（超出丢弃最旧）
var receivedBytes = 0;
var autoScroll = true;         // 用户上滚查看历史时暂停自动滚动
$dataView.addEventListener('scroll', function () {
  autoScroll = $dataView.scrollHeight - $dataView.scrollTop - $dataView.clientHeight < 30;
});
function dataLine(cls, text) {
  var div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  $dataView.appendChild(div);
  trimView();
  scrollViewBottom();
}
function pad8(n) { return n.toString(16).padStart(8, '0'); }
/* 以 hex + ASCII 转储追加一片数据（DocumentFragment 批量插入） */
function hexDump(bytes) {
  var frag = document.createDocumentFragment();
  for (var off = 0; off < bytes.length; off += 16) {
    var hex = '', asc = '';
    for (var i = 0; i < 16; i++) {
      if (off + i < bytes.length) {
        var c = bytes[off + i];
        hex += c.toString(16).padStart(2, '0') + (i === 7 ? '  ' : ' ');
        asc += (c >= 32 && c < 127) ? String.fromCharCode(c) : '·';
      } else {
        hex += '   ' + (i === 7 ? '  ' : '');
      }
    }
    var div = document.createElement('div');
    div.className = 'dim';
    div.textContent = pad8(off) + '  ' + hex + ' ' + asc;
    frag.appendChild(div);
  }
  $dataView.appendChild(frag);
  trimView();
  scrollViewBottom();
}
function fmtBytes(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
  return (n / 1024 / 1024).toFixed(2) + 'MB';
}
function updateRecvProg(seq) {
  var pct = total > 0 ? Math.round(seq / total * 100) : 0;
  $recvbarfill.style.width = pct + '%';
  $recvtext.textContent = '片 ' + seq + '/' + total + '（' + pct + '%）· 已接收 ' + fmtBytes(receivedBytes);
}

/* ===== 键盘事件实时回显（面板内实时行） ===== */
var liveLine = null;    // 当前帧输入实时行
var strayLine = null;   // 帧外杂散按键行（失焦残留等脏数据）
var strayBuf = '';
var liveChars = 0;
function trimView() {
  while ($dataView.childNodes.length > MAX_VIEW_LINES) {
    $dataView.removeChild($dataView.firstChild);
  }
  // 实时行可能被当作最旧行清掉，引用悬空则复位
  if (liveLine && !liveLine.isConnected) liveLine = null;
  if (strayLine && !strayLine.isConnected) strayLine = null;
}
function scrollViewBottom() {
  if (autoScroll) $dataView.scrollTop = $dataView.scrollHeight;
}
/* 帧内字符实时回显（节流：每 8 字符刷新一次，长内容只显示尾部） */
function liveFrameBegin() {
  liveLine = document.createElement('div');
  liveLine.className = 'dim';
  liveLine.dataset.prefix = '帧接收中: ';
  $dataView.appendChild(liveLine);
  liveChars = 0;
  updateLiveFrame();
  trimView();
  scrollViewBottom();
}
function updateLiveFrame() {
  if (!liveLine) return;
  var show = frameBuf;
  if (frameBuf.length > 90) 
    show = frameBuf.slice(0, 60) + '…' + frameBuf.slice(-20);
  liveLine.textContent = '⌨ ' + liveLine.dataset.prefix + show + '▏';
}
function liveFrameChar() {
  liveChars++;
  if (liveChars % 8 === 0) { updateLiveFrame(); scrollViewBottom(); }
}
function liveFrameCommit() {
  if (liveLine) {
    var n = frameBuf.length;
    var show = frameBuf;
    if (n > 90) {
      show = frameBuf.slice(0, 60) + '…' + frameBuf.slice(-20);
    }
    liveLine.textContent = '⌨ 帧提交（' + n + ' 字符）' + show;
    liveLine = null;
  }
}
function liveFrameReset() {
  if (liveLine) {
    liveLine.textContent = '↺ RESET 丢弃半帧（' + frameBuf.length + ' 字符）';
    liveLine.className = 'evt';
    liveLine = null;
  }
}
/* 帧外杂散按键：未在帧内收到的可打印字符（失焦残留/误触），标记警告 */
function noteStray(key) {
  strayBuf += key;
  if (strayBuf.length > 80) strayBuf = strayBuf.slice(-80);
  if (!strayLine) {
    strayLine = document.createElement('div');
    strayLine.className = 'err';
    $dataView.appendChild(strayLine);
  }
  strayLine.textContent = '⚠ 帧外按键（未在帧内，可能为失焦残留/脏数据）: ' + strayBuf;
  trimView();
  scrollViewBottom();
}
function strayCommit() { strayLine = null; strayBuf = ''; }

/* ===== 二维码反馈 ===== */
function renderQr(fb) {
  var json = JSON.stringify(fb);
  $sub.textContent = json;
  // 默认 Byte 模式仅取字符低 8 位，中文 err 消息会产生非法 UTF-8 字节，
  // 导致本机 rqrr 解码报 Encoding(Not UTF8)；显式启用 UTF-8 编码。
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  var qr = qrcode(0, 'M');
  qr.addData(json);
  qr.make();
  document.getElementById('qrcode').innerHTML = qr.createSvgTag(8, 4);
}
var lastLogStatus = '';
function feedback(status, seq, md5, err) {
  err = err || '';
  renderQr({ seq: seq, status: status, md5: md5 || '', err: err });
  // 异常状态同步到页面状态栏（OK/FINISH/READY 由业务流程自行 setStatus）
  if (status === 'ERROR') setStatus('❌ ' + (err || '接收端错误'), 'err');
  else if (status === 'RETRY') setStatus('⚠️ ' + (err || '分片校验失败，请求重传'), 'warn');
  else if (status === 'PAUSE') setStatus('⏸ 窗口失焦，已暂停（切回页面自动恢复）', 'warn');
  else if (status === 'UNAUTH') setStatus('⚠️ ' + (err || '请先点击「选择保存目录」授权保存目录'), 'warn');
  // 数据面板记录事件：RETRY 每次都记（可能原因不同），其余状态变化时才记
  if (status === 'RETRY') {
    dataLine('evt', '⚠️ 片 ' + (seq + 1) + ' 请求重传：' + (err || '校验失败'));
  } else if (status === 'ERROR') {
    dataLine('err', '❌ ' + (err || '接收端错误'));
  } else if (status !== lastLogStatus) {
    if (status === 'PAUSE') dataLine('evt', '⏸ 窗口失焦，暂停接收');
    else if (status === 'READY') dataLine('ok', '▶ 页面就绪/恢复，等待数据…');
    else if (status === 'UNAUTH') dataLine('evt', '⚠️ ' + (err || '未授权保存目录'));
  }
  lastLogStatus = status;
}

/* ===== 文件写入 ===== */

// 读取文件句柄的全部字节
async function readHandleBytes(fh) {
  var file = await fh.getFile();
  var buf = await file.arrayBuffer();
  return new Uint8Array(buf);
}

// 把字节写入 {fileName}.p{seq+1}，回读校验 md5 通过才算成功。
async function writePartFile(seq, payload) {
  if (!dirHandle) throw new Error('未授权保存目录');
  var partName = fileName + '.p' + (seq + 1);
  var fh = await dirHandle.getFileHandle(partName, { create: true });
  var w = await fh.createWritable();
  await w.write(payload);
  await w.close();
  // 回读校验：确保落盘内容与内存一致（防止写入中断产生脏文件）
  var back = await readHandleBytes(fh);
  if (md5Hex(back) !== md5Hex(payload)) {
    await dirHandle.removeEntry(partName);
    throw new Error('分片落盘后回读校验失败');
  }
}

// 扫描目录中已存在的 {fileName}.p{N}，返回已存在的 seq 集合（0-based）。
async function scanExistingParts() {
  var set = new Set();
  if (!dirHandle) return set;
  var prefix = fileName + '.p';
  for await (var entry of dirHandle.values()) {
    if (entry.kind !== 'file') continue;
    if (!entry.name.startsWith(prefix)) continue;
    var nStr = entry.name.slice(prefix.length);
    if (!/^\d+$/.test(nStr)) continue;
    var n = parseInt(nStr, 10);
    if (n >= 1 && n <= total) set.add(n - 1);
  }
  return set;
}

// 把已存在 seq 集合转为位图 hex 字符串。
function bitmaskHex(set) {
  var byteLen = Math.ceil(total / 8);
  var bytes = new Uint8Array(byteLen);
  set.forEach(function (seq) {
    var bi = Math.floor(seq / 8);
    var bit = seq % 8;
    bytes[bi] |= (1 << bit);
  });
  var hex = '';
  for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
  return hex;
}

// 拼接所有分片 → 解压（若 zflag）→ 写最终文件 → 返回整文件 md5。
async function assemble() {
  var bytes = new Uint8Array(receivedBytes);
  var off = 0;
  for (var seq = 0; seq < total; seq++) {
    var partName = fileName + '.p' + (seq + 1);
    var fh = await dirHandle.getFileHandle(partName, { create: false });
    var part = await readHandleBytes(fh);
    bytes.set(part, off);
    off += part.length;
  }
  var final = zflag ? fzstd.decompress(bytes) : bytes;
  var full = md5Hex(final);
  // 写入最终文件
  var fh = await dirHandle.getFileHandle(fileName, { create: true });
  var w = await fh.createWritable();
  await w.write(final);
  await w.close();
  return { md5: full, size: final.length };
}

// 重置传输状态（新文件 / PROBE 重置）
function resetTransfer() {
  received = new Set();
  receivedBytes = 0;
  transferStart = 0;
  $dataView.textContent = '';
  lastLogStatus = '';
}

async function handleFrame(body) {
  var parts = body.split('|');
  if (parts.length < 6) {
    feedback('ERROR', 0, '', '帧字段不足: ' + parts.length);
    return;
  }
  var seq = parseInt(parts[0], 10);
  if (!Number.isInteger(seq)) {
    feedback('ERROR', 0, '', '帧头解析失败');
    return;
  }

  // ===== PROBE 帧（seq = -1）：协商断点续传 =====
  if (seq === -1) {
    if (!dirHandle) { feedback('UNAUTH', 0, '', '未授权保存目录，请先点击「选择保存目录」'); return; }
    if (parts.length < 6) { feedback('ERROR', -1, '', 'PROBE 字段不足'); return; }
    total = parseInt(parts[1], 10);
    rawSize = parseInt(parts[2], 10);
    zflag = parseInt(parts[3], 10);
    var nameB64 = parts[4];
    var fileMd5 = parts[5];
    if (nameB64) {
      var nm = new TextDecoder().decode(b64ToBytes(nameB64));
      fileName = nm.split(/[\\/]/).pop() || 'received.bin';
    } else {
      fileName = 'received.bin';
    }
    resetTransfer();

    // 1) 完整文件已存在且 md5 匹配 → 直接完成
    try {
      var fullFh = await dirHandle.getFileHandle(fileName, { create: false });
      var fullBytes = await readHandleBytes(fullFh);
      if (md5Hex(fullBytes) === fileMd5) {
        setStatus('✅ 文件已存在且校验通过: ' + fileName, 'ok');
        dataLine('ok', '═══ 文件已存在，MD5 校验通过，跳过传输 ═══');
        feedback('FINISH', total - 1, fileMd5, '');
        return;
      }
    } catch (e) { /* 文件不存在，继续扫描分片 */ }

    // 2) 扫描已存在的 .pN 分片
    received = await scanExistingParts();
    receivedBytes = 0;
    // 统计已存在分片的字节数（用于进度显示）
    for (var s of received) {
      try {
        var pFh = await dirHandle.getFileHandle(fileName + '.p' + (s + 1), { create: false });
        receivedBytes += (await readHandleBytes(pFh)).length;
      } catch (e) {}
    }

    dataLine('evt', '═══ 续传探测：' + fileName + ' · 共 ' + total + ' 片 · 已存在 ' +
      received.size + ' 片' + (zflag ? ' · zstd' : '') + ' ═══');

    if (received.size === total) {
      // 所有分片已存在 → 直接拼接解压
      var r = await assemble();
      var elapsed = transferStart ? ((Date.now() - transferStart) / 1000) : 0;
      setStatus('✅ 传输完成: ' + fileName + '（' + total + ' 片）', 'ok');
      dataLine('ok', '═══ 传输完成 · ' + fmtBytes(r.size) + ' · MD5 ' + r.md5 +
        (elapsed ? ' · 耗时 ' + elapsed.toFixed(1) + 's' : '') + ' ═══');
      feedback('FINISH', total - 1, r.md5, '');
      fileName = null;
      return;
    }

    // 3) 返回位图给发送端
    var mask = bitmaskHex(received);
    updateRecvProg(received.size);
    setStatus('🔍 续传：已存在 ' + received.size + '/' + total + ' 片，等待传输剩余分片…', '');
    feedback('PROBE', -1, mask, '');
    return;
  }

  // ===== 数据帧 =====
  total = parseInt(parts[1], 10);
  rawSize = parseInt(parts[2], 10);
  var zstdFlag = parseInt(parts[3], 10);
  zflag = zstdFlag;
  var md5chunk = parts[4];
  var b64 = parts[5];
  var nameB64Data = parts[6];
  if (nameB64Data && !fileName) {
    var nm2 = new TextDecoder().decode(b64ToBytes(nameB64Data));
    fileName = nm2.split(/[\\/]/).pop() || 'received.bin';
  }
  if (!dirHandle) { feedback('UNAUTH', 0, '', '未授权保存目录，请先点击「选择保存目录」'); return; }

  var payload;
  try { payload = b64ToBytes(b64); }
  catch (e) { feedback('RETRY', seq, md5chunk, 'base64解码失败'); return; }

  if (md5Hex(payload) !== md5chunk) {
    feedback('RETRY', seq, md5chunk, '分片md5不匹配');
    return;
  }

  try {
    if (transferStart === 0) transferStart = Date.now();
    await writePartFile(seq, payload);
    received.add(seq);
    receivedBytes += payload.length;

    dataLine('evt', '── 片 ' + (seq + 1) + '/' + total + ' · ' + fmtBytes(payload.length) +
      ' · md5 ' + md5chunk.slice(0, 12) + (zstdFlag ? ' · zstd' : '') + ' ──');
    updateRecvProg(received.size);

    if (received.size === total) {
      var res = await assemble();
      var elapsed = ((Date.now() - transferStart) / 1000);
      setStatus('✅ 传输完成: ' + fileName + '（' + total + ' 片，' +
        fmtBytes(res.size) + '，耗时 ' + elapsed.toFixed(1) + 's）', 'ok');
      dataLine('ok', '═══ 传输完成 · ' + fmtBytes(res.size) + ' · MD5 ' + res.md5 +
        ' · 耗时 ' + elapsed.toFixed(1) + 's ═══');
      feedback('FINISH', seq, res.md5, '');
      fileName = null;
    } else {
      var elapsed2 = ((Date.now() - transferStart) / 1000);
      setStatus('✅ 已接收 ' + received.size + ' / ' + total + ' 片（' +
        fmtBytes(receivedBytes) + '，已用 ' + elapsed2.toFixed(1) + 's）', 'ok');
      feedback('OK', seq, md5chunk, '');
    }
  } catch (e) {
    dataLine('err', '❌ 写入失败: ' + e.message);
    feedback('ERROR', seq, '', '写入失败: ' + e.message);
  }
}

/* ===== 键盘协议监听 =====
 * STX = Ctrl+B / '{'   帧开始
 * ETX = Ctrl+C / '}'   帧结束（提交解析）
 * RESET = Ctrl+A       清空帧缓冲
 */
window.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey) {
    var k = (e.key || '').toLowerCase();
    if (k === 'b') {
      e.preventDefault();
      strayCommit();               // 新帧开始，帧外按键行固定为历史
      inFrame = true; frameBuf = '';
      liveFrameBegin();
    }
    else if (k === 'c') {
      e.preventDefault();
      if (inFrame) {
        var body = frameBuf;
        liveFrameCommit();         // 固定实时行为「帧提交」
        inFrame = false; frameBuf = '';
        handleFrame(body);
      }
    }
    else if (k === 'a') {
      e.preventDefault();
      if (inFrame) liveFrameReset();  // 半帧被丢弃，实时行记为 RESET（清空前）
      inFrame = false; frameBuf = '';
    }
    return; // 其它组合键放行（Ctrl+R/W/T 等浏览器功能不受影响）
  }
  if (e.key === '{') {
    e.preventDefault();
    strayCommit();
    inFrame = true; frameBuf = '';
    liveFrameBegin();
    return;
  }
  if (e.key === '}') {
    e.preventDefault();
    if (inFrame) {
      var b2 = frameBuf;
      liveFrameCommit();
      inFrame = false; frameBuf = '';
      handleFrame(b2);
    }
    return;
  }
  if (e.key.length === 1) {
    if (inFrame) {
      e.preventDefault();
      frameBuf += e.key;
      liveFrameChar();
    } else {
      // 帧外可打印字符：失焦残留/误触等，实时回显以便发现脏数据
      noteStray(e.key);
    }
  }
}, true);

/* ===== 焦点上报 =====
 * 未授权目录时不参与传输：blur 不发 PAUSE、focus 不发 READY（避免发送端误判），
 * 仅同步 UNAUTH 状态；授权后失焦立即 PAUSE，发送端暂停输入避免脏数据。
 */
window.addEventListener('blur', function () {
  if (!dirHandle) return;
  setStatus('⏸ 窗口失焦，已暂停（切回页面自动恢复）', 'warn');
  feedback('PAUSE', received.size, '', '');
});
window.addEventListener('focus', function () {
  if (inFrame) liveFrameReset(); // 失焦期间可能残留半个帧，丢弃并记录
  inFrame = false; frameBuf = '';
  if (dirHandle) {
    setStatus('▶ 页面聚焦，等待传输…', '');
    feedback('READY', received.size, '', '');
  } else {
    feedback('UNAUTH', 0, '', '未授权保存目录');
  }
});

/* ===== 目录授权 ===== */
document.getElementById('pick').addEventListener('click', async function () {
  if (!window.showDirectoryPicker) {
    setStatus('❌ 浏览器不支持 FileSystem API，请使用 Chrome / Edge', 'err');
    feedback('ERROR', 0, '', '浏览器不支持FileSystem API');
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    setStatus('✅ 已授权目录: ' + dirHandle.name + '，等待传输…', 'ok');
    feedback('READY', 0, '', '');
  } catch (e) {
    // 用户取消选择器（AbortError）：回到未授权状态，发送端继续等待而非报错
    if (e && e.name === 'AbortError') {
      feedback('UNAUTH', 0, '', '未授权保存目录（已取消选择）');
    } else {
      setStatus('❌ 目录授权失败: ' + (e && e.message || e), 'err');
      feedback('ERROR', 0, '', '目录授权失败: ' + (e && e.message || e));
    }
  }
});

/* ===== 初始化 ===== */
if (!window.showDirectoryPicker) {
  setStatus('❌ 浏览器不支持 FileSystem API，请使用 Chrome / Edge', 'err');
  feedback('ERROR', 0, '', '浏览器不支持FileSystem API');
} else {
  // 未授权目录：反馈 UNAUTH 而非 READY，发送端持续等待授权，不会提前发送
  setStatus('准备就绪，请先点击「选择保存目录」', 'warn');
  feedback('UNAUTH', 0, '', '未授权保存目录');
}
